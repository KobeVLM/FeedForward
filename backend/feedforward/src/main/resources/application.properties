spring.application.name=feedforward

#Setup JDBC connection
spring.datasource.url=jdbc:mysql://localhost:3306/feedforward_db

#Setup db login credentials
spring.datasource.username=root
spring.datasource.password=

#Auto create tables based on entities
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
 
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect

#for stack trace error not to appear 
server.error.include-stacktrace=never

#server.port = 8080

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Custom property for file upload directory (used in FileStorageConfig)
file.upload-dir=uploads